name: ios-testflight
# Trader Monitor iOS derlemesi -> TestFlight.
#
# Neden bu depo: GitHub'ın Mac makineleri herkese açık depolarda ücretsizdir; uygulamanın kaynağı ise
# gizli Trader-Mobile deposunda kalır ve yalnız derleme sırasında okunur. Bu depoda kod ve sır yoktur.
# Gereken dört sır depo ayarlarında (Secrets) durur ve yalnız bu iş akışına açılır; çatallara (fork)
# ve dışarıdan gelen PR'lara verilmez, iş yalnız elle (workflow_dispatch) tetiklenir. Oluşan IPA
# herkese açık yüklenmez; doğrudan App Store Connect'e (TestFlight) gönderilir.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Trader-Mobile dalı'
        default: master

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      ASC_KEY_ID: CXPU6U2KBL
    steps:
      - name: Sırlar tanımlı mı
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          EXPO_STATE_JSON: ${{ secrets.EXPO_STATE_JSON }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          EXPO_PUBLIC_MONITOR_TOKEN: ${{ secrets.EXPO_PUBLIC_MONITOR_TOKEN }}
        run: |
          missing=""
          for name in PRIVATE_REPO_TOKEN EXPO_STATE_JSON ASC_API_KEY_P8 EXPO_PUBLIC_MONITOR_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Eksik sır:$missing. Trader-Mobile/scripts/ios-build-secrets.ps1 ile girilir."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: ilkayturna/Trader-Mobile
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Uygulamanın erişim anahtarı (.env.local; derleme anında pakete girer)
        env:
          EXPO_PUBLIC_MONITOR_TOKEN: ${{ secrets.EXPO_PUBLIC_MONITOR_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf 'EXPO_PUBLIC_MONITOR_TOKEN=%s\n' "$EXPO_PUBLIC_MONITOR_TOKEN" > .env.local

      - name: Expo oturumu
        env:
          EXPO_STATE_JSON: ${{ secrets.EXPO_STATE_JSON }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.expo"
          umask 077
          printf '%s' "$EXPO_STATE_JSON" > "$HOME/.expo/state.json"
          if ! python3 -c 'import json,os,sys; json.load(open(os.path.expanduser("~/.expo/state.json")))' 2>/dev/null; then
            echo "::error::EXPO_STATE_JSON geçerli JSON değil (tırnaklar kaybolmuş olabilir). Trader-Mobile/scripts/ios-build-secrets.ps1 betiğini yeniden çalıştır."
            exit 1
          fi
          npx eas-cli@latest whoami

      - name: IPA derle (Mac üzerinde, EAS bulut kotası harcanmaz)
        run: |
          set -euo pipefail
          npx eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/TraderMonitor.ipa"
          ls -lh "$RUNNER_TEMP/TraderMonitor.ipa"

      - name: App Store Connect anahtarı
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$KEY_PATH"
          python3 - "$KEY_PATH" <<'PY'
          import json, sys
          cfg = json.load(open('eas.json'))
          cfg['submit']['production']['ios']['ascApiKeyPath'] = sys.argv[1]
          json.dump(cfg, open('eas.json', 'w'), indent=2)
          PY

      - name: TestFlight'a gönder
        run: |
          set -euo pipefail
          npx eas-cli@latest submit --platform ios --profile production --path "$RUNNER_TEMP/TraderMonitor.ipa" --non-interactive

      - name: Temizlik
        if: always()
        run: rm -f "$HOME/.expo/state.json" .env.local "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/TraderMonitor.ipa"
